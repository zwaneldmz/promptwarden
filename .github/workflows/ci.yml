name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck extension
        run: npm run typecheck

      - name: Test (includes <10ms bench gate)
        run: npm test

      - name: Build extension bundles
        run: npm run build:extension

      # The gate below scans built output as well as source, so the CLI
      # bundle has to exist by then. (npm test also builds it; this makes the
      # dependency explicit rather than incidental.)
      - name: Build CLI
        run: npm run build:cli

      # Produces apps/extension/engine.bundle.js (loaded by the options page)
      # and apps/playground/dist. Both are gitignored build output, so the
      # gate below and the release packaging need this to have run.
      - name: Build playground and options bundle
        run: npm run build:playground

      - name: No-egress gate
        run: |
          set -euo pipefail

          # Browser egress APIs (apply everywhere: a Node CLI has no business
          # calling any of these either) plus Node's own network built-ins,
          # which only became reachable once apps/cli/src existed — see
          # docs/ROADMAP.md §2.
          NETWORK_PATTERN='fetch\(|XMLHttpRequest|sendBeacon|WebSocket\(|EventSource\(|import\(|new Image\(|connectNative|node:http|node:https|node:net|node:tls|node:dgram|node:dns'

          # child_process (and its friends that shell out or reload modules
          # at runtime) is banned everywhere EXCEPT the one reviewed carve-out
          # below: apps/cli/src/mcp/gateway.ts spawns the real MCP server it
          # proxies stdio for. No other file in any target may use it.
          CHILD_PROCESS_PATTERN='child_process|execSync|spawnSync|createRequire'
          # The source file with the reviewed spawn, plus the bundles built
          # from it — apps/cli/dist/cli.js bundles every subcommand, so it
          # necessarily contains the gateway's import too. Excepting a bundle
          # does not widen the carve-out: every OTHER file under apps/cli/src
          # is still scanned individually, so a spawn smuggled into any other
          # module is caught at source even though it would also land in the
          # bundle. The network patterns still apply to all three.
          CHILD_PROCESS_EXCEPT_RE='^(apps/cli/src/mcp/gateway\.ts|apps/cli/dist/mcp/gateway\.js|apps/cli/dist/cli\.js):'

          # Built output is scanned alongside source: the bundle is what
          # actually runs, and a build step could in principle introduce a
          # call that no source file contains.
          TARGETS=(
            "apps/extension/src"
            "packages/policy-engine/src"
            "apps/cli/src"
            "apps/cli/dist"
            "apps/extension/content.bundle.js"
            "apps/extension/background.js"
            "apps/extension/popup.js"
            "apps/extension/popup.html"
            "apps/extension/options.js"
            "apps/extension/options.html"
            "apps/playground"
          )

          echo "Scanning for network egress APIs: $NETWORK_PATTERN"
          FOUND=0
          for t in "${TARGETS[@]}"; do
            if [ -e "$t" ]; then
              # No file-level exceptions here — the reviewed spawn carve-out
              # below is ONLY an exception to the child_process pattern,
              # never to the network patterns, so gateway.ts is scanned the
              # same as every other file for this pass.
              #
              # Documentation that has to name a banned API must carry the
              # explicit marker below on the same line. Filtering on comment
              # SYNTAX instead would be bypassable: inside a multi-line
              # template literal, a line beginning with `*` or `//` is still
              # executable code if it contains a `${...}` interpolation, so a
              # real call could hide on a line the filter treats as a comment.
              # An opt-in marker cannot be tripped by accident, and every use
              # of it is greppable in review.
              DOC_MARKER='no-egress-doc'
              MATCHES="$(grep -rnE "$NETWORK_PATTERN" "$t" | grep -v "$DOC_MARKER" || true)"
              if [ -n "$MATCHES" ]; then
                echo "$MATCHES"
                FOUND=1
              fi
            else
              echo "::error::no-egress gate target missing: $t"
              FOUND=1
            fi
          done

          echo "Scanning for child_process usage (reviewed carve-out: $CHILD_PROCESS_EXCEPT_RE): $CHILD_PROCESS_PATTERN"
          for t in "${TARGETS[@]}"; do
            if [ ! -e "$t" ]; then
              continue # already reported as missing above
            fi
            if [ -f "$t" ]; then
              MATCHES="$(grep -nE "$CHILD_PROCESS_PATTERN" "$t" | sed "s|^|$t:|" | grep -vE "$CHILD_PROCESS_EXCEPT_RE" || true)"
              if [ -n "$MATCHES" ]; then
                echo "$MATCHES"
                FOUND=1
              fi
            else
              # Directory target: grep recursively, then drop any match that
              # came from the one excepted file — every other file under the
              # directory (including every other file in apps/cli/src) is
              # still fully checked.
              MATCHES="$(grep -rnE "$CHILD_PROCESS_PATTERN" "$t" | grep -vE "$CHILD_PROCESS_EXCEPT_RE" || true)"
              if [ -n "$MATCHES" ]; then
                echo "$MATCHES"
                FOUND=1
              fi
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::NO-EGRESS GATE FAILED: network API usage, or child_process usage outside the one reviewed carve-out, found (or a scan target is missing) above."
            exit 1
          fi

          echo "No-egress gate passed: no fetch/XHR/sendBeacon/WebSocket/EventSource/dynamic-import/Image-beacon/connectNative/node:net-family calls found, and no child_process usage outside the reviewed MCP gateway spawn."

      # Separate from the no-egress gate above — this one has nothing to do
      # with network calls. This project's test corpus is inherently made of
      # credential-shaped strings (that's what a DLP tool's detectors need to
      # be tested against), which collides with GitHub's own scanners: a
      # literal that matches one of these shapes either blocks the push
      # (push protection) or files a secret-scanning alert indistinguishable
      # from a real leak. See CONTRIBUTING.md, "Test fixtures for a DLP
      # tool" — the convention is that any such fixture is assembled at
      # runtime from parts, never written as a literal. This gate enforces
      # that the convention can't silently regress.
      - name: Fixture hygiene gate
        run: |
          set -euo pipefail

          # Patterns describe SHAPES (vendor prefix + a length/charset a real
          # key of that kind would have), not real values — no full,
          # plausible credential appears anywhere in this file, only prefix
          # literals and regex character classes/quantifiers. That also
          # means this step cannot trip push protection or secret scanning
          # on itself: none of these lines is a credential, they're patterns
          # describing what one looks like.
          #
          # Card numbers and IBANs are deliberately NOT covered here (see
          # CONTRIBUTING.md): they must be checksum-valid literals to test
          # the credit_card/iban detectors meaningfully, and neither push
          # protection nor secret scanning flags them, so there is no
          # scanner to appease and nothing to de-literalize.
          #
          # The connection-string pattern's credential segments exclude
          # quote/template/interpolation characters ($ " ' ` { }) on purpose:
          # a properly runtime-assembled fixture (e.g. a template literal
          # with `${...}` holes for the user/pass parts) necessarily
          # introduces one of those characters right where a real embedded
          # credential would otherwise read as plain text, so the fixed form
          # naturally stops matching without needing a separate allowlist.
          FIXTURE_PATTERN='\b(AKIA|ASIA)[0-9A-Z]{16}\b'
          FIXTURE_PATTERN+='|\bgh[pousr]_[A-Za-z0-9]{20,}\b'
          FIXTURE_PATTERN+='|\bgithub_pat_[A-Za-z0-9_]{20,}\b'
          FIXTURE_PATTERN+='|\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
          FIXTURE_PATTERN+='|\bAIza[0-9A-Za-z_-]{20,}\b'
          FIXTURE_PATTERN+='|\b(sk|rk)_live_[A-Za-z0-9]{10,}\b'
          FIXTURE_PATTERN+='|\bsk-ant-[A-Za-z0-9_-]{10,}\b'
          FIXTURE_PATTERN+='|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          FIXTURE_PATTERN+='|[a-zA-Z][a-zA-Z0-9+.-]*://[^[:space:]:/@$"'"'"'\`{}]+:[^[:space:]@$"'"'"'\`{}]+@'

          # Scoped to where DLP test fixtures actually live, not the whole
          # tree — a detector-name string like "api_key" elsewhere in the
          # codebase is not a fixture. Only tracked files: an untracked
          # scratch file can never be pushed, so it can't trip a scanner.
          TEST_DIRS=(
            "packages/policy-engine/test"
            "apps/cli/test"
          )

          echo "Scanning tracked test files for credential-shaped literals: $FIXTURE_PATTERN"
          FOUND=0
          for d in "${TEST_DIRS[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::fixture hygiene gate target missing: $d"
              FOUND=1
              continue
            fi
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              MATCHES="$(grep -nE "$FIXTURE_PATTERN" "$f" || true)"
              if [ -n "$MATCHES" ]; then
                echo "$MATCHES" | sed "s|^|$f:|"
                FOUND=1
              fi
            done < <(git ls-files "$d")
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::FIXTURE HYGIENE GATE FAILED: a credential-shaped literal was found in a test fixture above. Assemble it at runtime from parts instead — see CONTRIBUTING.md, 'Test fixtures for a DLP tool'."
            exit 1
          fi

          echo "Fixture hygiene gate passed: no credential-shaped literals found in tracked test fixtures under ${TEST_DIRS[*]}."
