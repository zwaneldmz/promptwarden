<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 16px; background: #101418; color: #e8edf2;
         font: 13px/1.5 system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
  h2 { font-size: 11px; margin: 14px 0 4px; letter-spacing: .4px; text-transform: uppercase;
       color: #7f8a95; font-weight: 600; }
  .sub { color: #7f8a95; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0;
         border-top: 1px solid #1d242c; }
  .row:first-of-type { border-top: 0; }
  .val { color: #9fd0ff; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; margin-top: 12px; padding: 3px 8px; border-radius: 5px;
           background: #14301c; color: #7fd79a; font-size: 12px; }
  .badge.unmanaged { background: #2a2416; color: #d7bd7f; }
  .counts { display: flex; gap: 8px; }
  .count { flex: 1; text-align: center; padding: 8px 4px; border-radius: 6px; background: #171d24; }
  .count .n { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .count .label { display: block; font-size: 10px; color: #7f8a95; text-transform: uppercase;
                   letter-spacing: .3px; margin-top: 2px; }
  .count.blocked .n { color: #ff8a8a; }
  .count.warned .n { color: #d7bd7f; }
  .count.redacted .n { color: #9fd0ff; }
  ul.events { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
  .events li { padding: 6px 0; border-top: 1px solid #1d242c; font-size: 12px; }
  .events li:first-child { border-top: 0; }
  .ev-top { display: flex; justify-content: space-between; }
  .ev-host { color: #e8edf2; }
  .ev-time { color: #7f8a95; }
  .ev-meta { color: #7f8a95; margin-top: 1px; }
  .ev-action { text-transform: uppercase; font-size: 10px; letter-spacing: .3px; padding: 1px 5px;
               border-radius: 3px; margin-right: 4px; }
  .ev-action.block { background: #3a1a1a; color: #ff8a8a; }
  .ev-action.warn { background: #2a2416; color: #d7bd7f; }
  .ev-action.redact { background: #142430; color: #9fd0ff; }
  .empty { color: #7f8a95; font-style: italic; padding: 8px 0; }
  button#clear-events { margin-top: 12px; width: 100%; padding: 6px 0; border-radius: 5px;
        border: 1px solid #2a323b; background: #171d24; color: #e8edf2; font: inherit;
        cursor: pointer; }
  button#clear-events:hover { background: #1d242c; }
</style>
</head>
<body>
  <h1>PromptWarden</h1>
  <p class="sub">Guardrails for AI chat</p>

  <h2>Protection status</h2>
  <div class="row"><span>Active policy</span><span class="val" id="policy-name">–</span></div>
  <div class="row"><span>Rules</span><span class="val" id="rule-count">0</span></div>
  <div class="row"><span>Hosts</span><span class="val" id="host-count">0</span></div>
  <span class="badge unmanaged" id="mode">Standalone</span>

  <h2>Events on device</h2>
  <div class="counts">
    <div class="count blocked"><span class="n" id="count-blocked">0</span><span class="label">Blocked</span></div>
    <div class="count warned"><span class="n" id="count-warned">0</span><span class="label">Warned</span></div>
    <div class="count redacted"><span class="n" id="count-redacted">0</span><span class="label">Redacted</span></div>
  </div>

  <h2>Recent events</h2>
  <ul class="events" id="event-list"></ul>

  <button id="clear-events" type="button">Clear events</button>

  <script src="popup.js"></script>
</body>
</html>
